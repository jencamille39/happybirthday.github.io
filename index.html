<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart - You Are Loved</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #cbe6ff 0%, #eef7ff 50%, #ffe6f0 100%);
            --glass-bg: rgba(255, 255, 255, 0.78);
            --glass-border: rgba(255, 255, 255, 0.95);
            --primary-color: #d63384;
            --text-color: #2c3e50;
            --text-muted: #596a7a;
            --shadow: 0 15px 35px rgba(0, 110, 190, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body.heart-page {
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--text-color);
            overflow-x: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #floating-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .glass-card {
            position: relative;
            z-index: 2;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 45px;
            max-width: 520px;
            width: 90%;
        }

        h1 {
            font-size: 2.3rem;
            margin-bottom: 20px;
            color: var(--primary-color);
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(214, 51, 132, 0.1);
        }

        .big-icon {
            font-size: 4.5rem;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
            display: inline-block;
        }

        .big-icon:hover {
            transform: scale(1.25) rotate(5deg);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .message {
            font-size: 1.15rem;
            min-height: 65px;
            margin-bottom: 30px;
            line-height: 1.6;
            color: var(--text-muted);
            font-weight: 500;
        }

        .theme-nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.04);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 182, 193, 0.5);
        }

        .nav-item:hover {
            transform: translateY(-6px) scale(1.03);
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(214, 51, 132, 0.2);
        }

        .nav-icon {
            font-size: 1.8rem;
            margin-bottom: 4px;
        }

        .nav-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        #music-toggle-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 10;
            background: #ffffff;
            color: var(--primary-color);
            border: 2px solid #ffb6c1;
            padding: 12px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: all 0.2s ease;
        }

        #music-toggle-btn:hover {
            transform: scale(1.05);
            background: var(--primary-color);
            color: #ffffff;
        }

        .floating-item {
            position: absolute;
            top: -50px;
            user-select: none;
            pointer-events: none;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }
    </style>
</head>
<body class="heart-page">

    <!-- Background Music Audio -->
    <audio id="bg-music" loop>
        <source src="your-audio-file.mp3" type="audio/mpeg">
    </audio>

    <!-- Raining Flowers Background Container -->
    <div id="floating-bg"></div>

    <!-- Main Content Container -->
    <main class="glass-card">
        <h1>❤️ You Are Loved ❤️</h1>
        
        <div class="big-icon" id="heart-btn" title="Click for magic!">
            ❤️
        </div>

        <!-- Typewriter Birthday Message -->
        <p class="message" id="typewriter-text"></p>

        <!-- Bottom Emoji Navigation -->
        <nav class="theme-nav">
            <a href="cake.html" class="nav-item">
                <span class="nav-icon">🎂</span>
                <span class="nav-label">Cake</span>
            </a>
            <a href="balloons.html" class="nav-item">
                <span class="nav-icon">🎈</span>
                <span class="nav-label">Balloons</span>
            </a>
            <a href="bible.html" class="nav-item">
                <span class="nav-icon">📖</span>
                <span class="nav-label">Bible</span>
            </a>
        </nav>
    </main>

    <!-- Music Control Button -->
    <button id="music-toggle-btn" onclick="toggleMusic()">🎵 Play Music</button>

    <script>
        // Typewriter Message Effect
        const messages = [
            "Every heartbeat wishes you happiness, joy, and endless smiles!",
            "You bring so much light and magic into the world! ✨",
            "Hope your special day is filled with blooming love and sweet surprises! 🌷"
        ];
        let msgIndex = 0;
        let charIndex = 0;
        const speed = 65;
        const textElement = document.getElementById("typewriter-text");

        function typeWriter() {
            if (charIndex < messages[msgIndex].length) {
                textElement.innerHTML += messages[msgIndex].charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, speed);
            } else {
                setTimeout(eraseText, 3500);
            }
        }

        function eraseText() {
            if (charIndex > 0) {
                textElement.innerHTML = messages[msgIndex].substring(0, charIndex - 1);
                charIndex--;
                setTimeout(eraseText, 35);
            } else {
                msgIndex = (msgIndex + 1) % messages.length;
                setTimeout(typeWriter, 400);
            }
        }

        document.addEventListener("DOMContentLoaded", typeWriter);

        // Background Music Control
        function toggleMusic() {
            const music = document.getElementById("bg-music");
            const btn = document.getElementById("music-toggle-btn");
            if (music.paused) {
                music.play().then(() => {
                    btn.innerText = "🔇 Pause Music";
                }).catch(() => {
                    alert("Please link a valid audio track to 'your-audio-file.mp3' or play after interacting!");
                });
            } else {
                music.pause();
                btn.innerText = "🎵 Play Music";
            }
        }

        // Raining Tulips and Lilies Engine
        const symbols = ['🌷', '🪷', '🌷', '🪷', '✨', '🌸'];
        const bgContainer = document.getElementById('floating-bg');

        function createFallingElement() {
            const el = document.createElement('div');
            el.classList.add('floating-item');
            el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = Math.random() * 1.4 + 1.1 + 'rem';
            
            const duration = Math.random() * 4 + 4;
            el.style.animationDuration = duration + 's';
            
            bgContainer.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, duration * 1000);
        }

        setInterval(createFallingElement, 280);

        // Interactive Heart Explosion Effect
        document.getElementById('heart-btn').addEventListener('click', () => {
            for (let i = 0; i < 18; i++) {
                setTimeout(createFallingElement, i * 40);
            }
        });
    </script>
</body>
</html>
